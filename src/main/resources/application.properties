spring.application.name=mediconnect
spring.datasource.url=jdbc:h2:file:./data/mediconnect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
mediconnect.patient.encryption-key=${PATIENT_ENCRYPTION_KEY}
mediconnect.security.public-key=${JWT_PUBLIC_KEY}
mediconnect.security.issuer=${JWT_ISSUER}
mediconnect.security.audience=${JWT_AUDIENCE}
mediconnect.security.clock-skew-seconds=30
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
logging.structured.format.console=logstash
